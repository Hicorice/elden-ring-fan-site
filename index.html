<!DOCTYPE html>
<html lang="en">
<head>

  <title>Elden Ring Fan Site</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Styles */
    .fullscreen-bg {
      background-size: cover;
      background-position: center;

  </style>
</head>
<body class="text-white">

  <!-- Homepage Section -->
  <section class="fullscreen-bg" style="background-image: url('assets/images/elden-ring-wallpaper.jpg');">

    </div>

  <section class="bg-gray-900 py-12">
    <div class="text-center">
